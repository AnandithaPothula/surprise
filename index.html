<!DOCTYPE html>
<html>
<head>
  <title>Open Your Surprise 💐</title>
  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#ff9a9e,#fad0c4);
      font-family:Arial, sans-serif;
      text-align:center;
      flex-direction:column;
    }

    button{
      padding:15px 30px;
      border:none;
      background:#ff4d6d;
      color:white;
      font-size:18px;
      border-radius:30px;
      cursor:pointer;
      margin-bottom:30px;
    }

    #lyrics{
      font-size:22px;
      color:#fff;
      line-height:1.5;
      max-width:600px;
      opacity:0;
      transition: opacity 1.5s ease;
      text-shadow: 1px 1px 10px #ff4d6d;
    }

    .show{
      opacity:1;
    }
  </style>
</head>
<body>

<h1>💐 Special Surprise For You</h1>
<button id="openBtn">Open Bouquet 🎵</button>
<p id="lyrics"></p>

<audio id="song">
  <source src="song.mp3" type="audio/mpeg">
</audio>

<script>
document.getElementById("openBtn").addEventListener("click", function(){

  const song = document.getElementById("song");
  const lyricsEl = document.getElementById("lyrics");

  // Open bouquet in new tab
  window.open("https://digibouquet.vercel.app/bouquet/9a9a9f9f-0770-4563-a99c-e4efb5839a06", "_blank");

  // Play song from 1:00 to 1:40
  song.currentTime = 60;
  song.play().catch(err => console.log("Autoplay blocked:", err));

  // Lyrics lines
  const lyrics = [
    "Because this is where I want to be",
    "Where it's so sweet and heavenly",
    "I'm giving you all my, giving you all my",
    "Giving you all my love",
    "Giving you all my, giving you all my",
    "Giving you all my love",
    "All my love"
  ];

  // Timing: divide 40 sec equally among 7 lines (~5.7s each)
  const durationPerLine = 5.7; // seconds
  let currentLine = 0;

  lyricsEl.innerText = "";
  lyricsEl.classList.add("show");

  const interval = setInterval(() => {
    if(currentLine < lyrics.length){
      lyricsEl.innerText = lyrics[currentLine];
      currentLine++;
    } else {
      // Loop back if you want
      currentLine = 0;
    }
  }, durationPerLine * 1000);

  // Loop audio from 1:00 to 1:40
  song.ontimeupdate = function(){
    if(song.currentTime >= 100){
      song.currentTime = 60;
    }
  };

});
</script>

</body>
</html>
