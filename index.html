<!DOCTYPE html>
<html>
<head>
  <title>Open Your Surprise :^)</title>
  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#ff9a9e,#fad0c4);
      font-family:Arial, sans-serif;
      text-align:center;
      flex-direction:column;
    }

    button{
      padding:15px 30px;
      border:none;
      background:#ff4d6d;
      color:white;
      font-size:18px;
      border-radius:30px;
      cursor:pointer;
      margin-bottom:30px;
    }

    #lyrics{
      font-size:22px;
      color:#fff;
      line-height:1.5;
      max-width:600px;
      opacity:0;
      transition: opacity 1.5s ease;
      text-shadow: 1px 1px 10px #ff4d6d;
    }

    .show{
      opacity:1;
    }
  </style>
</head>
<body>

<h1>💐 Special Surprise For You</h1>
<button id="openBtn">Open Bouquet 🎵</button>
<p id="lyrics"></p>

<audio id="song">
  <source src="song.mp3" type="audio/mpeg">
</audio>

<script>
document.getElementById("openBtn").addEventListener("click", function(){

  const song = document.getElementById("song");
  const lyricsEl = document.getElementById("lyrics");

  // Play song first
  song.currentTime = 60; // start at 1:00
  song.play().catch(err => console.log("Autoplay blocked:", err));

  // Lyrics array
  const lyrics = [
    "Because this is where I want to be",
    "Where it's so sweet and heavenly",
    "I'm giving you all my, giving you all my",
    "Giving you all my love",
    "Giving you all my, giving you all my",
    "Giving you all my love",
    "All my love"
  ];

  const durationPerLine = 40 / lyrics.length; // ~5.7 sec per line
  let currentLine = 0;

  // Show lyrics
  lyricsEl.classList.add("show");
  lyricsEl.innerText = lyrics[currentLine];

  const lyricsInterval = setInterval(()=>{
    currentLine++;
    if(currentLine >= lyrics.length) currentLine = 0;
    lyricsEl.innerText = lyrics[currentLine];
  }, durationPerLine*1000);

  // Loop audio from 1:00 to 1:40
  song.ontimeupdate = function(){
    if(song.currentTime >= 100){
      song.currentTime = 60;
    }
  };

  // Open bouquet after small delay (500ms)
  setTimeout(()=>{
    window.open("https://digibouquet.vercel.app/bouquet/9a9a9f9f-0770-4563-a99c-e4efb5839a06","_blank");
  },500);

});
</script>

</body>
</html>
