<!DOCTYPE html>
<html>
<head>
  <title>Open Your Surprise 💐</title>
  <style>
.lyrics{
  margin-top:20px;
  font-size:20px;
  color:#ff4d6d;
  opacity:0;
  transition:opacity 1.5s ease;
}
.show{
  opacity:1;
}

    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#ff9a9e,#fad0c4);
      font-family:Arial;
      text-align:center;
    }
    button{
      padding:15px 30px;
      border:none;
      background:#ff4d6d;
      color:white;
      font-size:18px;
      border-radius:30px;
      cursor:pointer;
    }


  </style>
</head>
<body>

<div>
  <h1>💐 Special Surprise For You</h1>
  <button onclick="startSurprise()">Open Bouquet 🎵</button>
<p id="lyrics" style="margin-top:20px; font-size:20px; color:#ff4d6d;"></p>
</div>

<audio id="song" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>


<script>
function startSurprise(){
  const song = document.getElementById("song");
  const lyrics = document.getElementById("lyrics");

  song.currentTime = 60;
  song.play();

  // Open bouquet AFTER small delay
  setTimeout(() => {
    window.open("https://digibouquet.vercel.app/bouquet/9a9a9f9f-0770-4563-a99c-e4efb5839a06", "_blank");
  }, 1000);

  // Check time every 500ms manually
  setInterval(() => {

    if (song.currentTime >= 100) {
      song.currentTime = 60;
    }

    if (song.currentTime >= 60 && song.currentTime < 70) {
      lyrics.innerText = "Your first lyric line 💖";
    }
    else if (song.currentTime >= 70 && song.currentTime < 80) {
      lyrics.innerText = "Second line 🌸";
    }
    else if (song.currentTime >= 80 && song.currentTime < 90) {
      lyrics.innerText = "Third line 💕";
    }
    else if (song.currentTime >= 90 && song.currentTime < 100) {
      lyrics.innerText = "Last line ❤️";
    }

  }, 500);
}
</script>
</body>
</html>
