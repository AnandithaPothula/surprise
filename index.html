<!DOCTYPE html>
<html>
<head>
  <title>Open Your Surprise 💐</title>
  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#ff9a9e,#fad0c4);
      font-family:Arial;
      text-align:center;
    }

    button{
      padding:15px 30px;
      border:none;
      background:#ff4d6d;
      color:white;
      font-size:18px;
      border-radius:30px;
      cursor:pointer;
    }

    #lyrics{
      margin-top:20px;
      font-size:20px;
      color:#ff4d6d;
      opacity:0;
      transition: opacity 1s ease;
    }
    .show{
      opacity:1;
    }
  </style>
</head>
<body>

<div>
  <h1>💐 Special Surprise For You</h1>
  <button id="openBtn">Open Bouquet 🎵</button>
  <p id="lyrics"></p>
</div>

<audio id="song">
  <source src="song.mp3" type="audio/mpeg">
</audio>

<script>
document.getElementById("openBtn").addEventListener("click", function(){

  const song = document.getElementById("song");
  const lyrics = document.getElementById("lyrics");

  // Start song from 1:00
  song.currentTime = 60;
  song.play().catch(err => console.log("Autoplay blocked, click allowed:", err));

  // Open bouquet link after small delay
  setTimeout(() => {
    window.open("https://digibouquet.vercel.app/bouquet/9a9a9f9f-0770-4563-a99c-e4efb5839a06", "_blank");
  }, 500);

  // Lyrics and loop
  song.ontimeupdate = function(){
    if(song.currentTime >= 100){ // 1:40
      song.currentTime = 60; // 1:00
    }

    let text = "";
    if(song.currentTime >= 60 && song.currentTime < 70){
      text = "Because this is where I want to be
Where it's so sweet and heavenly
";
    }
    else if(song.currentTime >= 70 && song.currentTime < 80){
      text = "I'm giving you all my, giving you all my
Giving you all my love";
    }
    else if(song.currentTime >= 80 && song.currentTime < 90){
      text = "Giving you all my, giving you all my
Giving you all my love";
    }
    else if(song.currentTime >= 90 && song.currentTime < 100){
      text = "All my love ❤️";
    }

    if(lyrics.innerText !== text){
      lyrics.classList.remove("show");
      setTimeout(()=>{
        lyrics.innerText = text;
        lyrics.classList.add("show");
      },100);
    }
  };

});
</script>

</body>
</html>
